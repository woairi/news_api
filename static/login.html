<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - AI News Briefing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Init theme immediately
        const savedTheme = localStorage.getItem('theme') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'system') {
            document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        } else {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="text-center mb-4">
                <span style="font-size: 3rem;">🔐</span>
                <h1 style="margin-top: 16px; font: var(--md-sys-typescale-headline-medium);">관리자 로그인</h1>
                <p style="color: var(--md-sys-color-on-surface-variant);">시스템 설정을 변경하려면 로그인하세요.</p>
            </div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" name="password" class="text-field" required autofocus>
                </div>
                
                <div id="errorMessage" style="color: var(--md-sys-color-error); margin-bottom: 16px; display: none; text-align: center;">
                    비밀번호가 올바르지 않습니다.
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">로그인</button>
            </form>

            <div class="text-center" style="margin-top: 24px;">
                <a href="/" class="btn btn-text">← 메인 페이지로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = event.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '로그인 중...';
            errorMessage.style.display = 'none';

            try {
                // Form data 형식으로 전송
                const formData = new URLSearchParams();
                formData.append('password', password);

                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem('admin_token', data.token);
                    window.location.href = '/admin/settings';
                } else {
                    errorMessage.style.display = 'block';
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                console.error(error);
                errorMessage.textContent = '로그인 요청 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '로그인';
            }
        }
    </script>
</body>
</html>
